name: CI tests

on: push

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps: 
      - name: Download repo code(checkout)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt
      
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest # on template test_*.py